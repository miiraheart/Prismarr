name: Build audibox image

# Builds this fork's `audibox` branch and publishes it to GHCR.
#
# Version scheme: <upstream-version>-audibox.<n>   e.g. 1.1.1-audibox.2
#   <upstream-version> = newest upstream release tag reachable from `main`
#   <n>                = commits on `audibox` that are not on `main`
# So the tag states both which upstream release this is based on and how far
# ahead of it we are. The same string is baked in as PRISMARR_VERSION, which
# Prismarr's AppVersion service surfaces in the UI.
#
# amd64 only: the target server is amd64 and skipping the arm64 emulation leg
# roughly halves build time.

on:
  push:
    branches: [audibox]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute version
        id: ver
        run: |
          # The fork carries no tags of its own; upstream is the source of truth.
          git remote add upstream https://github.com/Shoshuo/Prismarr.git || true
          git fetch upstream --tags --prune --quiet
          git fetch origin main --quiet || true

          BASE_TAG=$(git describe --tags --abbrev=0 upstream/main 2>/dev/null || echo v0.0.0)
          BASE=${BASE_TAG#v}
          DELTA=$(git rev-list --count origin/main..HEAD 2>/dev/null || echo 0)
          VERSION="${BASE}-audibox.${DELTA}"

          IMAGE=$(echo "ghcr.io/${{ github.repository_owner }}/prismarr" | tr '[:upper:]' '[:lower:]')

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE"     >> "$GITHUB_OUTPUT"
          echo "Building $IMAGE:$VERSION (upstream $BASE_TAG + $DELTA commits)"
          echo "### \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
          echo "upstream \`$BASE_TAG\` + $DELTA local commits" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frankenphp/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            PRISMARR_VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ${{ steps.ver.outputs.image }}:${{ steps.ver.outputs.version }}
            ${{ steps.ver.outputs.image }}:audibox
            ${{ steps.ver.outputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
